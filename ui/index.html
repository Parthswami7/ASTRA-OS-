<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. V6.5 UI</title>
    <style>
/* 1. Transparent Background with Tactical Grid */
        body {
            margin: 0;
            padding: 40px;
            /* FIX: Changed from solid color to a highly transparent tint! */
            background-color: rgba(2, 11, 20, 0.2); 
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #00f3ff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            overflow: hidden;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        /* 2. Left Panel: System Logs & Title */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            z-index: 2;
        }

        .title {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 0;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #00f3ff;
        }

        .subtitle {
            font-size: 1rem;
            margin-top: 5px;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        .sys-logs {
            margin-top: 40px;
            font-size: 0.95rem;
            line-height: 1.6;
            text-transform: uppercase;
        }

        .sys-logs span {
            display: block;
            margin-bottom: 5px;
            animation: fadeIn 0.5s ease-in forwards;
            opacity: 0;
        }

        /* Staggered animation for fake boot logs */
        .sys-logs span:nth-child(1) { animation-delay: 0.2s; }
        .sys-logs span:nth-child(2) { animation-delay: 0.4s; }
        .sys-logs span:nth-child(3) { animation-delay: 0.6s; }
        .sys-logs span:nth-child(4) { animation-delay: 0.8s; }
        .sys-logs span:nth-child(5) { animation-delay: 1.0s; }

        /* 3. Right Panel: Radar Reactor */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .reactor-container {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Glowing Center */
        .core {
            position: absolute;
            width: 70px;
            height: 70px;
            background: #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 30px #00f3ff, 0 0 80px #00f3ff;
            animation: pulse 2s infinite alternate;
        }

        /* Segmented Rotating Rings */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .ring-1 {
            width: 180px;
            height: 180px;
            border-top: 3px solid #00f3ff;
            border-bottom: 3px solid #00f3ff;
            animation: spin 6s linear infinite;
        }

        .ring-2 {
            width: 280px;
            height: 280px;
            border-left: 2px solid rgba(0, 243, 255, 0.5);
            border-right: 2px dashed rgba(0, 243, 255, 0.8);
            animation: spin-reverse 10s linear infinite;
        }

        .ring-3 {
            width: 400px;
            height: 400px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1) inset;
        }

        /* The horizontal scanning line from the image */
        .scan-line {
            position: absolute;
            width: 150%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f3ff, transparent);
            top: 50%;
            left: -50%;
            opacity: 0.5;
            animation: scan 4s ease-in-out infinite alternate;
        }

        /* Live Command Terminal at the bottom */
        .live-terminal {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-size: 1.2rem;
            background: rgba(0, 20, 40, 0.8);
            padding: 10px 20px;
            border-left: 4px solid #00f3ff;
        }

        /* --- ANIMATIONS --- */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 
            0% { transform: scale(0.95); opacity: 0.8; } 
            100% { transform: scale(1.05); opacity: 1; } 
        }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes scan { 
            0% { transform: translateY(-180px); } 
            100% { transform: translateY(180px); } 
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <h1 class="title">J.A.R.V.I.S V6.5</h1>
        <div class="subtitle">UNIVERSAL DIRECTIVE OS & CORE ACCELERATOR</div>
        
        <div class="sys-logs">
            <span>> NEURAL OS KEYWORD LISTENER... ACTIVE</span>
            <span>> SOC CPU HARDWARE UDP MONITOR... ONLINE</span>
            <span>> SPEECH AND AUDIO SYNTHETIC CORE... SECURE</span>
            <span>> ENVIRONMENTAL SENSORS... NOMINAL</span>
            <span>> LOCAL MEMORY VECTOR DATABASE... COMPILED</span>
        </div>
    </div>

    <div class="right-panel">
        <div class="reactor-container">
            <div class="scan-line"></div>
            <div class="ring ring-3"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-1"></div>
            <div class="core"></div>
        </div>
    </div>

    <div class="live-terminal" id="live-text">
        [AWAITING COMMAND...]
    </div>

</body>
</html>
